<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>tu chibres ou bien?</title>
        <link rel="preload" as="font" type="font/ttf" crossorigin href="fonts/aFTU7PB1QTsUX8KYhh0.ttf">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>tu chibres ou&nbsp;bien?</h1>
        <div class="container">
            <div class="fan">
                <img class="card1" src="cards/9S.svg">
                <img class="card2" src="cards/QS.svg">
                <img class="card3" src="cards/10S.svg">
                <img class="card4" src="cards/6S.svg">
                <img class="card5" src="cards/9H.svg">
                <img class="card6" src="cards/10C.svg">
                <img class="card7" src="cards/KC.svg">
                <img class="card8" src="cards/AC.svg">
                <img class="card9" src="cards/9D.svg">
            </div>
            <div class="options">
                <button><span class="symbol">♠</span>pique<span class="ev"></span></button>
                <button><span class="symbol red">♥</span>coeur<span class="ev"></span></button>
                <button><span class="symbol">♣</span>trèfle<span class="ev"></span></button>
                <button><span class="symbol red">♦</span>carreau<span class="ev"></span></button>
                <button><span class="symbol">⇄</span>chibre!<span class="ev"></span></button>
            </div>
        </div>
    </body>
    <script>
        const buttons = document.querySelectorAll('.options button');
        let clicked = false;

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (!clicked) {
                    const coeurButton = Array.from(buttons).find(btn => btn.textContent.includes('coeur'));

                    // Always make coeur green and remove red from its span
                    if (coeurButton) {
                        coeurButton.style.backgroundColor = 'green';
                        coeurButton.style.color = 'white';
                        coeurButton.querySelector('.symbol').classList.remove('red');
                    }

                    if (button.textContent.includes('coeur')) {
                        // If coeur button is clicked, it's already handled above
                    } else {
                        // If a non-coeur button is clicked, it turns red
                        button.style.backgroundColor = '#D40000';
                        button.style.color = 'white';
                        // And its own span should lose the red class if it has one
                        const span = button.querySelector('.symbol');
                        if (span) {
                            span.classList.remove('red');
                        }
                    }

                    // Display 99.9 for all buttons
                    buttons.forEach(btn => {
                        const solutionSpan = btn.querySelector('.ev');
                        if (solutionSpan) {
                            solutionSpan.textContent = '99.9';
                        }
                    });

                    clicked = true;
                }
            });
        });
    </script>
</html>
