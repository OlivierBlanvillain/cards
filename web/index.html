<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>tu chibres ou bien?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      .dm-mono-regular {
        font-family: "DM Mono", monospace;
        font-weight: 400;
        font-style: normal;
      }
      body {
        background: #113f67;
      }
      header {
        text-align: center;
        margin-bottom: 30px;
      }
      header h1 {
        font-size: 3em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        color: white;
        font-family: "DM Mono", "Monaco", "Menlo", "Ubuntu Mono", monospace;
      }
      .fan {
      	position: relative;
        width: 600px;
        height: 310px;
        margin: 0 auto;
        display: block;
      }
      .fan img.card { 
      	position: absolute;
      }
    </style>
    <script type="text/javascript" src="https://livejs.com/live.js"></script>
  </head>
  <body>
    <header>
      <h1>tu chibres ou bien?</h1>
    </header>
    <div class="fan">
      <img class="card" src="cards/KS.svg" style="top: 18px; transform: rotate(343deg);">
      <img class="card" src="cards/QS.svg" style="left: 39px; top: 8px; transform: rotate(349deg);">
      <img class="card" src="cards/10S.svg" style="left: 78px; top: 2px; transform: rotate(354deg);">
      <img class="card" src="cards/9H.svg" style="left: 118px; top: 0px; transform: rotate(360deg);">
      <img class="card" src="cards/3H.svg" style="left: 158px; top: 2px; transform: rotate(366deg);">
      <img class="card" src="cards/JC.svg" style="left: 197px; top: 8px; transform: rotate(371deg);">
      <img class="card" src="cards/9C.svg" style="left: 236px; top: 18px; transform: rotate(377deg);">
      <img class="card" src="cards/AD.svg" style="left: 274px; top: 31px; transform: rotate(383deg);">
    </div>
  </body>
</html>
