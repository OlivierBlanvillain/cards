<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>tu chibres ou bien?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/keyboard-css@1.2.4/dist/css/main.min.css">
    <style>
      body {
        background: #113f67;
      }
      h1 {
        text-align: center;
        font-size: 3em;
        font-family: "DM Mono", "Ubuntu Mono", monospace;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        color: white;
      }
      .fan {
      	position: relative;
        width: 617px;
        height: 380px;
        margin: 40px auto;
      }
      .options {
        width: 445px;
        position: relative;
        width: 445px;
        margin: 0 auto;
      }
      img { 
      	position: absolute;
        pointer-events: none;
        user-select: none;
      }
      button {
        width: 180px;
        padding: 9px 20px 11px 20px;
        margin: 0 20px;
        color: #030303;
        font-size: 2em;
        font-family: "DM Mono", "Ubuntu Mono", monospace;
        cursor: pointer;
        text-align: center;
        position: relative;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        border-width: 0;
        border-radius: 40px;
      }
      button:hover {
        background: #bbb;
      }
      button:active {
        background: #999;
      }
    </style>
    <script type="text/javascript" src="https://livejs.com/live.js"></script>
  </head>
  <body>
    <h1>tu chibres ou&nbsp;bien?</h1>
    <div class="fan">
      <img src="http://localhost:9000/web/cards/AS.svg" style="left: 39px; top: 35px; transform: rotate(342deg);">
      <img src="http://localhost:9000/web/cards/KS.svg" style="left: 77px; top: 24px; transform: rotate(346deg);">
      <img src="http://localhost:9000/web/cards/QS.svg" style="left: 116px; top: 16px; transform: rotate(351deg);">
      <img src="http://localhost:9000/web/cards/10S.svg" style="left: 156px; top: 12px; transform: rotate(355deg);">
      <img src="http://localhost:9000/web/cards/9H.svg" style="left: 195px; top: 10px; transform: rotate(360deg);">
      <img src="http://localhost:9000/web/cards/3H.svg" style="left: 235px; top: 12px; transform: rotate(365deg);">
      <img src="http://localhost:9000/web/cards/JC.svg" style="left: 275px; top: 16px; transform: rotate(369deg);">
      <img src="http://localhost:9000/web/cards/9C.svg" style="left: 314px; top: 24px; transform: rotate(374deg);">
      <img src="http://localhost:9000/web/cards/AD.svg" style="left: 352px; top: 35px; transform: rotate(378deg);">
    </div>
    <div class="options">
      <button>carreau</button>
      <button>chibre</button>
    </div>
  </body>
</html>
